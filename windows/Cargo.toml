[package]
name = "directlink-host"
version = "0.1.0"
edition = "2021"
authors = ["Autonomous Agent"]

[dependencies]
tokio = { version = "1.37", features = ["full", "macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.5"
mdns-sd = "0.11" # For LAN discovery
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio-tungstenite = "0.21.0"
futures-util = "0.3.30"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
rand = "0.8.5"
hex = "0.4.3"
windows = { version = "0.58.0", features = ["Win32_Media_MediaFoundation", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi"] }
rayon = "1.12.0"
cpal = "0.18.2"
opus-pure = "0.2.1"
eframe = "0.29.0"
egui = "0.29.0"
local-ip-address = "0.6.13"
socket2 = "0.6.5"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58.0"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Media_MediaFoundation",
    "Graphics_Capture",
]



[lib]
crate-type = ["cdylib", "rlib"]





